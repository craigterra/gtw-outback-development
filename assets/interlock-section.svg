<svg viewBox="0 0 650 340" role="img" aria-labelledby="section-title section-desc" xmlns="http://www.w3.org/2000/svg"><title id="section-title">Opposed recessed channels captured by an H-key</title><desc id="section-desc">End view along the track. The upper channel opens down and the lower opens up. Their lip faces meet on the cabinet joint plane. One flange of the H-key sits inside each channel, with its narrow web crossing the joint.</desc><defs><pattern id="sheet-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#c5bdad" stroke-width="1"/></pattern></defs><rect width="650" height="340" fill="#f4eee3"/><path d="M35 40H345V156H325V60H55V156H35Z M35 272H345V156H325V252H55V156H35Z" fill="url(#sheet-hatch)" stroke="#797d76" stroke-width="2"/><path d="M60 60H320V156H250V132H296V84H84V132H130V156H60Z" fill="#b8c1bd" stroke="#202422" stroke-width="2"/><path d="M60 60H320V156H250V132H296V84H84V132H130V156H60Z" transform="translate(0 312) scale(1 -1)" fill="#b8c1bd" stroke="#202422" stroke-width="2"/><path d="M110 108H270V128H200V184H270V204H110V184H180V128H110Z" fill="#e66a32" stroke="#202422" stroke-width="2"/><path d="M20 156H350" stroke="#bf542c" stroke-dasharray="5 5"/><g fill="none" stroke="#656b65" stroke-width="1.5"><path d="M305 73H380V53H410"/><path d="M210 120H375V116H410"/><path d="M325 156H410"/><path d="M300 244H380V225H410"/></g><g fill="#202422" font-family="Arial,sans-serif" font-size="14"><text x="420" y="58">Upper channel</text><text x="420" y="78" font-size="12" fill="#656b65">Mouth down</text><text x="420" y="121">Aluminium H-key</text><text x="420" y="161">Faces touch</text><text x="420" y="181" font-size="12" fill="#656b65">No added stack height</text><text x="420" y="230">Lower channel</text><text x="420" y="250" font-size="12" fill="#656b65">Mouth up</text><text x="35" y="315" font-size="12" fill="#656b65">End-on principle • looking along the track • proportions illustrative</text></g></svg>