<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc"><title id="title">Simple opposing C-channels and a true H-key</title><desc id="desc">Two simple single-wall aluminium C-channels are recessed in the cases. Their open mouths face each other and their lips touch. Each broad H-key flange is captured inside one C-channel, joined by a single central web.</desc><rect x="0" y="0" width="720" height="340" fill="#f4eee3" stroke="none" stroke-width="2"/><text x="55" y="55" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#202422" font-weight="700">SIMPLE C + H + C</text><rect x="55" y="112" width="370" height="12" fill="#797e77" stroke="none" stroke-width="2"/><rect x="55" y="222" width="370" height="12" fill="#797e77" stroke="none" stroke-width="2"/><path d="M80 125H400V173H280V167H394V131H86V167H200V173H80Z" fill="#c1c8c5" stroke="#202422" stroke-width="1.2"/><path d="M80 125H400V173H280V167H394V131H86V167H200V173H80Z" transform="translate(0 346) scale(1 -1)" fill="#c1c8c5" stroke="#202422" stroke-width="1.2"/><path d="M135 145H345V153H248V193H345V201H135V193H232V153H135Z" fill="#e66a32" stroke="#202422" stroke-width="1.2"/><path d="M38 173H437" fill="none" stroke="#bf542c" stroke-width="2" stroke-dasharray="5 5"/><path d="M401 128H470V110H490" fill="none" stroke="#656b65" stroke-width="2"/><text x="500" y="116" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#202422" font-weight="700">Simple C-channel</text><path d="M315 149H461V151H490" fill="none" stroke="#656b65" stroke-width="2"/><text x="500" y="157" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#202422" font-weight="700">H-key flange</text><path d="M407 173H490" fill="none" stroke="#656b65" stroke-width="2"/><text x="500" y="179" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#202422" font-weight="700">Lips touch</text><path d="M240 180H463V210H490" fill="none" stroke="#656b65" stroke-width="2"/><text x="500" y="216" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#202422" font-weight="700">Single central web</text><text x="55" y="275" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#202422" font-weight="700">Recessed into the cases. Open faces meet.</text><text x="55" y="302" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#656b65" font-weight="400">One flange inside each C-channel; no spacer between cases.</text><text x="55" y="327" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#656b65" font-weight="400">End-on section. Key slides into the page. Not to scale.</text></svg>